<script>

var Q = [
 {t:"Modelagem",
  q:"Numa escola, os dados reais correspondentes exclusivamente à aluna Ana Souza, do 3º A, formam o que o banco de dados chama de “Registro”. O que ele representa?",
  o:["O ambiente virtual onde todas as informações da escola ficam armazenadas globalmente.","Uma característica estrutural que define as categorias da tabela, como “nome” ou “turma”.","Uma instância ou linha única de dados reais inseridos horizontalmente na tabela.","O arquivo que agrupa e organiza um tipo geral e unificado de informação.","A chave identificadora que conecta diferentes edifícios no mesmo terreno digital."],
  a:2,e:"Registro é uma linha (tupla) da tabela: os dados reais de uma única ocorrência, como a Ana Souza."},
 {t:"Chave primária",
  q:"O campo id_aluno foi criado com INT AUTO_INCREMENT PRIMARY KEY. A propriedade PRIMARY KEY garante estruturalmente que:",
  o:["O campo aceitará apenas números inteiros, impedindo erros de digitação com texto.","O identificador aumentará automaticamente a cada novo cadastro.","O preenchimento do campo seja obrigatório, impedindo cadastros em branco.","Cada estudante seja identificado de maneira exclusiva, sem duas linhas com o mesmo código.","As informações pessoais dos alunos sejam criptografadas."],
  a:3,e:"A chave primária identifica cada linha de forma única. O auto aumento vem do AUTO_INCREMENT e o tipo inteiro vem do INT."},
 {t:"MySQL Workbench",
  q:"O sistema retornou erro de sintaxe: não conseguia saber onde um comando terminava e o outro começava. O júnior esqueceu a “Regra de Ouro”, que exige:",
  o:["Separar os blocos de código apertando Enter para criar espaçamentos.","Finalizar cada instrução com o caractere de ponto e vírgula (;).","Encapsular todo o texto da consulta entre aspas duplas.","Digitar a palavra reservada END no término do bloco.","Indentar o comando final, arrastando-o para a margem esquerda."],
  a:1,e:"No MySQL Workbench, o ponto e vírgula marca o fim de cada instrução."},
 {t:"Chave estrangeira",
  q:"O sistema bloqueou a nota do “Aluno ID 999” porque não existia aluno com esse ID. Isso foi possível graças à FOREIGN KEY, cuja função é:",
  o:["Renomear temporariamente uma coluna para facilitar a leitura da consulta.","Exibir o esqueleto da tabela, listando quais campos aceitam nulos.","Criar uma ligação estrutural que obriga a tabela dependente a aceitar apenas IDs que existam na tabela de origem.","Realizar cálculos automáticos para cruzar dados de várias tabelas.","Exportar automaticamente dados de uma tabela para outra a cada novo aluno aprovado."],
  a:2,e:"A chave estrangeira garante integridade referencial: só aceita valores que existem na tabela referenciada."},
 {t:"Alias (AS)",
  q:"Na consulta SELECT nome, (nota1 + nota2) / 2 AS media FROM notas; o cabeçalho exibiu apenas “media”. O AS media atingiu seu objetivo ao:",
  o:["Filtrar a consulta, exibindo só os alunos com média superior a 2.","Criar um apelido temporário no cabeçalho, renomeando a coluna calculada para facilitar a leitura.","Alterar a estrutura do banco, inserindo permanentemente o cálculo na tabela notas.","Indicar que nota1 e nota2 podem ser nulas, exigindo tratamento especial.","Arredondar o resultado para o inteiro mais próximo."],
  a:1,e:"AS cria um alias (apelido) só para o resultado daquela consulta. Nada muda na tabela."},
 {t:"WHERE e SELECT",
  q:"Sobre a cláusula WHERE e as operações aritméticas no SELECT, classifique cada afirmativa em V ou F. Qual sequência está correta?",
  s:["I. WHERE atua como filtro linha a linha, testando uma condição booleana; só as linhas verdadeiras são selecionadas.","II. O WHERE é avaliado somente após o GROUP BY e o ORDER BY de todos os dados da tabela.","III. Uma fórmula no SELECT recalcula e altera permanentemente o valor armazenado no disco para todas as linhas.","IV. O motor processa expressões aritméticas linha a linha, gerando colunas temporárias virtuais, sem modificar a estrutura física dos dados.","V. Como o cálculo não tem nome de coluna nativo, o apelido (AS) é recomendado para deixar o cabeçalho legível."],
  o:["V – F – F – V – V","F – V – V – F – F","V – V – F – V – F","F – F – V – F – V","V – F – V – F – V"],
  a:0,e:"II é falsa: o WHERE vem antes do GROUP BY e do ORDER BY. III é falsa: o SELECT não altera o que está gravado."},
 {t:"Tipagem na DDL",
  q:"Na charge, o programador definiu nome como INT e cpf como VARCHAR(2). Sobre tipagem de dados, quais afirmativas estão corretas?",
  s:["I. Tipos incompatíveis ou genéricos demais comprometem a integridade de domínio e permitem registros corrompidos.","II. Escolher mal entre CHAR e VARCHAR, ou superdimensionar colunas, desperdiça espaço e prejudica a indexação.","III. A tipagem no CREATE TABLE é só documentação visual, pois o SGBD converte automaticamente qualquer valor.","IV. Tipos inadequados forçam conversões implícitas custosas, invalidando índices e deixando WHERE e JOIN mais lentos."],
  o:["I, II e III.","II, III e IV.","I, II e IV.","I, III e IV.","Todas as afirmativas."],
  a:2,e:"III é falsa: a tipagem é imposta pelo SGBD e restringe o que pode ser inserido."},
 {t:"CREATE DATABASE e USE",
  q:"Usando a analogia do terreno e dos edifícios, qual descrição explica corretamente CREATE DATABASE e USE?",
  o:["CREATE DATABASE constrói um edifício (tabela) e USE o demole.","CREATE DATABASE separa o terreno (cria o banco) e USE escolhe esse terreno para trabalhar, para que os próximos comandos sejam executados nele.","CREATE DATABASE e USE fazem a mesma coisa: ambos criam o banco e a tabela.","CREATE DATABASE apaga o terreno antigo e USE restaura os dados salvos.","CREATE DATABASE insere registros e USE define a chave primária."],
  a:1,e:"CREATE DATABASE cria o banco (o terreno). USE seleciona o banco ativo, como entrar no terreno antes de construir as tabelas (edifícios)."},
 {t:"INSERT INTO",
  q:"Tabela alunos(id_aluno, nome, email), nessa ordem. Por que a ordem dos valores no VALUES (...) é crucial, e qual inserção está correta?",
  o:["A ordem não importa, o MySQL reorganiza sozinho: INSERT INTO alunos VALUES ('Ana','ana@email.com',1);","Os valores são associados às colunas por posição. Correto: INSERT INTO alunos VALUES (1,'Ana','ana@email.com'); a ordem trocada gravaria dados na coluna errada.","Só o primeiro valor importa, porque o id define o resto: INSERT INTO alunos VALUES (1,'ana@email.com','Ana');","A ordem só importa em tabelas sem chave primária: INSERT INTO alunos VALUES ('ana@email.com',1,'Ana');","Os valores devem sempre vir em ordem alfabética, por exemplo: VALUES ('ana@email.com','Ana',1);"],
  a:1,e:"Sem lista de colunas, os valores seguem a ordem estrutural da tabela. Trocar a ordem coloca o dado na coluna errada ou gera erro de tipo."},
 {t:"DESCRIBE",
  q:"Sobre o comando DESCRIBE (ou DESC) no MySQL, classifique em V ou F. Qual sequência está correta?",
  s:["I. Pertence à categoria DML e serve para alterar o conteúdo ou apagar registros corrompidos.","II. A coluna Field mostra o nome exato de cada atributo (coluna) da tabela.","III. A coluna Null indica se a coluna aceita valores nulos (YES) ou se é obrigatória (NO).","IV. O rótulo Type indica as restrições de integridade referencial, mostrando as chaves estrangeiras.","V. A coluna Type exibe apenas o tipo de dado (ex.: INT, VARCHAR(50), DATE), e não as chaves estrangeiras."],
  o:["F – V – V – F – V","V – F – V – V – F","F – F – V – F – V","V – V – F – V – F","F – V – F – V – F"],
  a:0,e:"DESCRIBE só mostra a estrutura, sem alterar dados. Type mostra o tipo de dado. As chaves aparecem na coluna Key."},
{"t": "Evolução da informação", "q": "(ENEM) Na secretaria de uma escola técnica, os históricos dos estudantes estão em pilhas de fichas de papel e em planilhas isoladas, mantidas por setores diferentes. Um mesmo aluno aparece com grafias distintas do nome, algumas notas estão duplicadas e localizar um histórico leva horas. A direção decide adotar um Sistema de Gerenciamento de Banco de Dados (SGBD). A principal vantagem do banco de dados, nesse cenário, em relação ao modelo anterior é:", "o": ["substituir a necessidade de cadastrar os alunos, pois o sistema gera as informações sozinho.", "armazenar os dados em arquivos separados por setor, preservando a autonomia de cada planilha.", "reunir os dados em um conjunto organizado e centralizado, reduzindo duplicidades e facilitando as buscas.", "impedir que qualquer usuário consulte informações, garantindo sigilo sem necessidade de permissões.", "aumentar o volume de papel arquivado, garantindo cópias físicas de todos os registros."], "a": 2, "e": "O banco de dados é um conjunto vivo, organizado e seguro de informações. Centralizar evita duplicidade e acelera as buscas."},
{"t": "Anatomia da informação", "q": "(Concurso) Em um banco de dados chamado boletim_escolar, a tabela alunos possui as colunas nome, turma e idade, e a linha “1 | Ana | 3º A” representa uma aluna cadastrada. Considerando a analogia do terreno e dos edifícios, assinale a alternativa que apresenta uma associação INCORRETA.", "o": ["Banco de dados: o terreno em que todas as informações ficam armazenadas.", "Tabela: o edifício que organiza um tipo específico de informação.", "Coluna (turma): característica estrutural que se repete para todos os alunos.", "Coluna (idade): uma linha única de dados reais de um aluno.", "Registro (1 | Ana | 3º A): uma linha única de dados reais."], "a": 3, "e": "Coluna é a característica estrutural (como idade). A linha única de dados reais é o registro."},
{"t": "Áreas do Workbench", "q": "(ENEM) Ao abrir o MySQL Workbench, uma estudante identifica três áreas na tela: [1] a lista de conexões, [2] uma área com linhas numeradas para digitação e [3] uma grade logo abaixo. Ela digita CREATE DATABASE escola; e executa. Para escrever os comandos e para ler a resposta do servidor, ela deve usar, respectivamente:", "o": ["a área [1], para escrever; e a área [2], para ler a resposta.", "a área [2] (Editor SQL), para escrever; e a área [3] (Resultado), para ler a resposta.", "a área [3], para escrever; e a área [1], para ler a resposta.", "a área [2], para escrever; e a área [1], para ler a resposta.", "a área [1], para escrever; e a área [3], para ler a resposta."], "a": 1, "e": "O Editor SQL é o canteiro de obras, onde os comandos são digitados. A área de Resultado é onde o banco responde."},
{"t": "SHOW DATABASES", "q": "(Concurso) Antes de criar o banco boletim_escolar em um servidor MySQL compartilhado, um técnico precisa verificar se já existe algum banco com esse nome. O comando mais adequado para listar todos os bancos de dados disponíveis no servidor é:", "o": ["DESCRIBE boletim_escolar;", "USE boletim_escolar;", "SELECT * FROM boletim_escolar;", "SHOW TABLES;", "SHOW DATABASES;"], "a": 4, "e": "SHOW DATABASES; lista os bancos do servidor. SHOW TABLES lista tabelas do banco já selecionado."},
{"t": "Erro: No database selected", "q": "(ENEM) Um desenvolvedor abriu o MySQL Workbench, conectou-se ao servidor e executou o comando abaixo. O sistema respondeu com o erro “No database selected”.", "s": ["CREATE TABLE alunos (", "  id_aluno INT AUTO_INCREMENT PRIMARY KEY,", "  nome VARCHAR(100) NOT NULL", ");", "A causa do erro e a correção adequada são, respectivamente:"], "o": ["o MySQL não sabia em qual banco criar a tabela; é preciso executar USE nome_do_banco; antes do CREATE TABLE.", "a tabela não pode ter chave primária; é preciso remover o PRIMARY KEY.", "o ponto e vírgula final está incorreto; é preciso substituí-lo por END.", "o tipo VARCHAR não existe; é preciso trocá-lo por INT.", "o nome da tabela é reservado; é preciso escrevê-lo entre aspas duplas."], "a": 0, "e": "O USE informa ao MySQL que os próximos comandos acontecerão dentro daquele banco."},
{"t": "Escolha de tipos", "q": "(Concurso) Deseja-se criar a tabela alunos para armazenar o nome completo (ex.: “Ana Souza”), a turma (ex.: “3º A”) e a idade em anos (ex.: 17). Escolhendo tipos de dados coerentes com a natureza de cada informação, a definição mais adequada das colunas é:", "o": ["nome INT, turma INT, idade VARCHAR(3)", "nome VARCHAR(100), turma INT, idade VARCHAR(3)", "nome INT, turma VARCHAR(20), idade INT", "nome VARCHAR(100), turma VARCHAR(20), idade INT", "nome VARCHAR(100), turma VARCHAR(20), idade VARCHAR(100)"], "a": 3, "e": "INT serve para números inteiros (idade). VARCHAR(X) serve para textos com limite máximo X, como nome e turma."},
{"t": "Significado de VARCHAR(X)", "q": "(ENEM) A coluna turma de uma tabela foi definida como VARCHAR(5). Um operador tenta cadastrar nela o texto “Turma 3º A – Manhã”. Com base no que o número entre parênteses representa em VARCHAR(X), é correto afirmar que:", "o": ["o valor será aceito integralmente, pois o X indica a quantidade mínima de caracteres.", "o texto excede o limite máximo de 5 caracteres definido para a coluna, portanto não cabe integralmente nela.", "o valor será aceito, pois o X indica a quantidade de linhas que a coluna comporta.", "o texto será convertido automaticamente em número inteiro.", "o valor será aceito, pois o VARCHAR ignora o limite quando o texto contém acentos."], "a": 1, "e": "O X de VARCHAR(X) é o número máximo de caracteres. Textos maiores não cabem."},
{"t": "AUTO_INCREMENT", "q": "(Concurso) A tabela alunos, inicialmente vazia, foi criada com id_aluno INT AUTO_INCREMENT PRIMARY KEY. Foram executadas as instruções abaixo, sem informar o id_aluno em nenhum INSERT.", "s": ["I. INSERT INTO alunos (nome) VALUES ('Ana');", "II. INSERT INTO alunos (nome) VALUES ('Bruno');", "III. INSERT INTO alunos (nome) VALUES ('Carla');", "IV. DELETE FROM alunos WHERE nome = 'Bruno';", "V. INSERT INTO alunos (nome) VALUES ('Diego');", "Nessas condições (mecanismo InnoDB, em funcionamento contínuo), o valor atribuído automaticamente a id_aluno para Diego é:"], "o": ["1", "2", "3", "5", "4"], "a": 4, "e": "O contador do AUTO_INCREMENT só avança: Ana = 1, Bruno = 2, Carla = 3 e Diego = 4. O número 2, liberado pela exclusão, não é reaproveitado."},
{"t": "NOT NULL", "q": "(ENEM) A coluna nome da tabela alunos foi criada com a restrição NOT NULL. No modo padrão do MySQL atual, um funcionário executa a instrução abaixo, esquecendo-se de informar o nome do estudante.", "s": ["INSERT INTO alunos (turma, idade)", "VALUES ('3º B', 16);", "O comportamento esperado do SGBD diante dessa instrução é:"], "o": ["gravar o registro normalmente e preencher o nome com o texto “nome”.", "gravar o registro e deslocar os valores '3º B' e 16 para as colunas id_aluno e nome.", "rejeitar a inserção, pois a coluna nome é obrigatória e não recebeu valor.", "gravar o registro com o nome em branco, permitindo preenchê-lo mais tarde sem restrições.", "apagar o registro mais recente para liberar espaço e inserir o novo."], "a": 2, "e": "NOT NULL torna o campo obrigatório: o sistema não aceitará um aluno sem nome."},
{"t": "SELECT * ou colunas", "q": "(Concurso) A escola possui uma tabela alunos com milhares de registros e dezenas de colunas. Para montar a lista de chamada impressa, que exibe somente o nome e a turma de cada estudante, o analista deve optar pela consulta mais objetiva e leve. Assinale-a.", "o": ["SELECT nome, turma FROM alunos;", "SELECT * FROM alunos;", "SELECT FROM alunos nome, turma;", "SELECT all FROM alunos;", "SHOW nome, turma FROM alunos;"], "a": 0, "e": "O asterisco traz todas as colunas. Citar apenas as colunas desejadas torna a consulta mais rápida e limpa."},
{"t": "INSERT com vários registros", "q": "(ENEM) Para cadastrar dois estudantes de uma só vez, um técnico executou a instrução abaixo. Sobre o resultado, é correto afirmar que:", "s": ["INSERT INTO alunos (nome, turma, idade)", "VALUES", "('Carlos Silva', '3º A', 18),", "('Mariana Santos', '3º B', 17);"], "o": ["apenas Carlos Silva é cadastrado, pois cada INSERT aceita um único registro.", "os dois registros são cadastrados em um único comando, com os grupos de valores separados por vírgula e o ponto e vírgula apenas ao final.", "ocorre erro de sintaxe, pois cada grupo de valores exigiria seu próprio INSERT INTO.", "os dois registros são unificados em uma única linha, com os nomes concatenados.", "ambos são cadastrados, mas o ponto e vírgula deveria estar ao final de cada grupo de valores."], "a": 1, "e": "Vários registros podem ser enviados no mesmo VALUES, separados por vírgula. O ponto e vírgula encerra a instrução."},
{"t": "Filtro WHERE", "q": "(Concurso) A tabela alunos contém os registros a seguir. Ao executar SELECT nome FROM alunos WHERE idade > 17;, o resultado exibirá:", "s": ["Ana Souza — 17 anos", "Carlos Silva — 18 anos", "Mariana Santos — 17 anos", "João Lima — 19 anos"], "o": ["Ana Souza, Carlos Silva, Mariana Santos e João Lima.", "Ana Souza e Mariana Santos.", "Ana Souza, Carlos Silva e João Lima.", "Carlos Silva e João Lima.", "somente João Lima."], "a": 3, "e": "O operador > exclui quem tem exatamente 17. Passam pelo filtro apenas as idades 18 e 19."},
{"t": "Média e filtro", "q": "(ENEM) Em uma escola, é aprovado o aluno cuja média aritmética das duas provas é igual ou superior a 7,0. A tabela notas contém: Aluno A (nota1 = 6,5; nota2 = 8,5), Aluno B (nota1 = 5,0; nota2 = 8,0) e Aluno C (nota1 = 9,0; nota2 = 4,0). Foi executada a consulta abaixo, e o resultado apresentará:", "s": ["SELECT nome, (nota1 + nota2) / 2 AS media", "FROM notas", "WHERE (nota1 + nota2) / 2 >= 7;"], "o": ["uma linha: Aluno A, com media igual a 7,5.", "duas linhas: Aluno A (7,5) e Aluno B (6,5).", "três linhas, com as médias 7,5; 6,5 e 6,5.", "uma linha: Aluno C, com media igual a 6,5.", "nenhuma linha, pois o alias media não pode ser usado em colunas calculadas."], "a": 0, "e": "As médias são A = 7,5, B = 6,5 e C = 6,5. Só o Aluno A atende à condição >= 7."},
{"t": "Precedência dos operadores", "q": "(Concurso) Um estagiário queria calcular a média de dois bimestres e escreveu a consulta abaixo. Para um aluno com nota1 = 8 e nota2 = 6, o campo media exibiu o valor 11, e não 7. O valor 11 apareceu porque:", "s": ["SELECT nome, nota1 + nota2 / 2 AS media FROM notas;"], "o": ["o apelido AS media altera o valor numérico da soma.", "o MySQL arredonda sempre para cima os resultados que têm apelido.", "a divisão tem precedência sobre a soma, calculando 8 + (6 / 2); o correto seria usar parênteses: (nota1 + nota2) / 2.", "o operador / soma os valores quando usado em consultas SELECT.", "a coluna nota2 foi dividida duas vezes por ter sido escrita após o sinal de adição."], "a": 2, "e": "Sem parênteses, o banco calcula 6 / 2 = 3 e depois 8 + 3 = 11. Com (nota1 + nota2) / 2 o resultado é 7."},
{"t": "Papel da tabela notas", "q": "(ENEM) Em um banco escolar, cada aluno cursa várias disciplinas, e cada disciplina é cursada por vários alunos. Para registrar a nota de cada aluno em cada disciplina, o projetista criou a tabela notas, com as colunas id_nota, id_aluno, id_disciplina, nota1 e nota2, ligando-a às tabelas alunos e disciplinas. Do ponto de vista da modelagem, o papel da tabela notas é:", "o": ["duplicar os dados pessoais dos alunos para acelerar as consultas.", "substituir a tabela disciplinas, que passa a ser desnecessária.", "armazenar apenas os nomes das disciplinas em ordem alfabética.", "impedir que um aluno seja cadastrado em mais de uma disciplina.", "ligar as duas tabelas, permitindo que cada aluno tenha notas em várias disciplinas e cada disciplina tenha notas de vários alunos."], "a": 4, "e": "A tabela notas é a ponte entre alunos e disciplinas, por meio das chaves estrangeiras id_aluno e id_disciplina."},
{"t": "Ordem de criação das tabelas", "q": "(Concurso) Ao executar o script de criação do banco escolar, um desenvolvedor criou primeiro a tabela notas, que contém FOREIGN KEY (id_aluno) REFERENCES alunos(id_aluno), e obteve erro informando que a tabela referenciada não pôde ser aberta. Para que o script funcione, a ordem correta de criação das tabelas é:", "o": ["notas, alunos, disciplinas.", "alunos e disciplinas (tabelas referenciadas) primeiro e, depois, notas.", "notas, disciplinas, alunos.", "disciplinas, notas, alunos.", "qualquer ordem, pois o MySQL cria as ligações depois da execução do script."], "a": 1, "e": "A chave estrangeira só pode apontar para uma tabela que já exista. Por isso, as tabelas de origem são criadas antes."},
{"t": "DECIMAL(4,2)", "q": "(ENEM) A coluna nota1 de uma tabela foi definida como DECIMAL(4,2), isto é, até 4 dígitos no total, dos quais 2 são casas decimais. Considerando que as notas escolares variam de 0 a 10, qual dos valores abaixo NÃO poderá ser armazenado nessa coluna?", "o": ["10.00", "9.75", "0.50", "100.00", "7.50"], "a": 3, "e": "Com 4 dígitos no total e 2 decimais, restam 2 para a parte inteira. O maior valor é 99.99, e 100.00 exigiria 5 dígitos."},
{"t": "Identificando chaves estrangeiras", "q": "(Concurso) Observe a estrutura de três tabelas de um banco relacional, em que as chaves primárias (PK) estão indicadas. Assinale a alternativa que identifica corretamente as chaves estrangeiras (FK) existentes nesse modelo.", "s": ["ALUNOS (PK id_aluno, nome, turma, idade)", "DISCIPLINAS (PK id_disciplina, nome_disciplina)", "NOTAS (PK id_nota, id_aluno, id_disciplina, nota1, nota2)"], "o": ["id_aluno e id_disciplina, ambas na tabela NOTAS.", "id_nota, na tabela NOTAS.", "nome e turma, na tabela ALUNOS.", "id_aluno, na tabela ALUNOS, e id_disciplina, na tabela DISCIPLINAS.", "nota1 e nota2, na tabela NOTAS."], "a": 0, "e": "Em NOTAS, id_aluno e id_disciplina apontam para as chaves primárias das tabelas de origem, logo são chaves estrangeiras."},
{"t": "Ciclo de vida estrutural", "q": "(ENEM) Um estagiário precisa implantar do zero o boletim escolar. Seguindo o ciclo de vida estrutural de um banco de dados (criar o banco, criar as tabelas, inserir os dados e consultá-los), a sequência correta de comandos é:", "o": ["INSERT INTO → CREATE TABLE → CREATE DATABASE → SELECT", "SELECT → INSERT INTO → CREATE TABLE → CREATE DATABASE", "CREATE DATABASE (e USE) → CREATE TABLE → INSERT INTO → SELECT", "CREATE TABLE → CREATE DATABASE → SELECT → INSERT INTO", "USE → SELECT → CREATE TABLE → INSERT INTO"], "a": 2, "e": "Primeiro o terreno, depois o edifício, depois os moradores, e só então a consulta."},
{"t": "Próximos desafios", "q": "(Concurso) Após estruturar o banco boletim_escolar, a secretaria precisa realizar três tarefas: (I) corrigir a turma de um aluno cadastrada com erro; (II) excluir um cadastro duplicado; (III) exibir, em uma só consulta, o nome do aluno ao lado de suas notas, cruzando as tabelas alunos e notas. Os recursos do SQL indicados para as tarefas I, II e III são, respectivamente:", "o": ["DELETE, UPDATE e JOIN.", "UPDATE, JOIN e DELETE.", "JOIN, DELETE e UPDATE.", "UPDATE, DELETE e JOIN.", "INSERT, UPDATE e SELECT *."], "a": 3, "e": "UPDATE altera registros existentes. DELETE remove registros. JOIN cruza dados de tabelas relacionadas."}
];

var RXC=/(CREATE DATABASE|CREATE TABLE|INSERT INTO|SHOW DATABASES;?|SHOW TABLES;?|SELECT [^.;]*?;|DESCRIBE [a-z_]+;?|USE [a-z_]+;|VARCHAR\(\w+\)|DECIMAL\(\d,\d\)|\(nota1 \+ nota2\) \/ 2|AUTO_INCREMENT|PRIMARY KEY|FOREIGN KEY|NOT NULL|AS media|GROUP BY|ORDER BY|[a-z]+_[a-z_]+(?:\(\w+\))?|\b(?:INT|VARCHAR|DECIMAL|CHAR|JOIN|UPDATE|DELETE|WHERE|SELECT|INSERT|VALUES|FROM|DESCRIBE|DESC|DML|DDL|USE|SHOW)\b)/g;

function wrap(node,text,rx,tag,cls){rx.lastIndex=0;var last=0,m;while((m=rx.exec(text))){if(m.index>last)node.appendChild(document.createTextNode(text.slice(last,m.index)));var c=document.createElement(tag);if(cls)c.className=cls;c.textContent=m[0];node.appendChild(c);last=m.index+m[0].length;if(!m[0].length)rx.lastIndex++;}if(last<text.length)node.appendChild(document.createTextNode(text.slice(last)));return node;}
function fmt(node,text){return wrap(node,text,RXC,"code");}
function optText(i,t){var s=el("span","tx");s.appendChild(el("span","ltr",String.fromCharCode(65+i)));var b=el("span","ot");if(/^[VF] – [VF]/.test(t))b.className="ot seq";fmt(b,t);s.appendChild(b);return s;}
function isCode(l){return /^(\s|INSERT|SELECT|CREATE|FROM|WHERE|VALUES|UPDATE|DELETE|SHOW|\(|\)|'|[IVX]+\. (INSERT|DELETE))/.test(l);}
function sents(t){var out=[],re=/[.?!]\s+(?=[A-ZÀ-Ú“])/g,last=0,m;while((m=re.exec(t))){out.push(t.slice(last,m.index+1));last=m.index+m[0].length;}out.push(t.slice(last));return out;}
function stemNode(q){

 var ss=sents(txt),ctx="",cmd="",lines=q.s?q.s.slice():[];

 else if(ss.length>1){cmd=ss.pop();if(cmd.length<28&&ss.length>1)cmd=ss.pop()+" "+cmd;ctx=ss.join(" ");}

var AC=null,MUTE=false,lastN=0,lastLeft=99;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC;}
function tone(f,_,d,type,v,when){var a=ac();if(!a||MUTE)return;var w=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,w);g.gain.setValueAtTime(.0001,w);g.gain.exponentialRampToValueAtTime(v||.2,w+.02);g.gain.exponentialRampToValueAtTime(.0001,w+d);o.connect(g);g.connect(a.destination);o.start(w);o.stop(w+d+.05);}
var SND={
 start:function(){[392,523,659,784].forEach(function(f,i){tone(f,0,.2,"square",.1,i*.11);});},
 pick:function(){tone(620,0,.08,"sine",.18,0);},

 correct:function(){tone(660,0,.14,"triangle",.25,0);tone(880,0,.14,"triangle",.25,.12);tone(1320,0,.35,"triangle",.25,.24);},

};
function mkSnd(){var b=document.createElement("button");b.id="snd";b.setAttribute("aria-label","Ligar ou desligar o som");b.textContent="\ud83d\udd0a";b.onclick=function(){MUTE=!MUTE;b.textContent=MUTE?"\ud83d\udd07":"\ud83d\udd0a";if(!MUTE){ac();SND.pick();}};document.body.appendChild(b);document.addEventListener("pointerdown",function(){ac();},{once:true});}
var app = document.getElementById("app");
var P = [], qi = 0, pi = 0, tmr = null, t0 = 0, locked = false;

function el(tag, cls, txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function clear(){clearInterval(tmr);app.innerHTML="";}
function btn(txt,fn,cls){var b=el("button","btn "+(cls||""),txt);b.onclick=fn;return b;}

function setup(){
  clear();
  app.appendChild(el("h1",null,"Quiz AV1: Banco de Dados"));
  app.appendChild(el("p","center","30 perguntas · 4º período · IEMA Pleno"));
  var box=el("div","box");
  box.appendChild(el("p",null,"Quem vai jogar? Preencha de 1 a 6 nomes. Cada jogador responde na sua vez, no mesmo aparelho."));
  box.style.cssText="background:rgba(0,0,0,.25);padding:16px;border-radius:10px;display:flex;flex-direction:column;gap:8px";
  var ins=[];
  var sk=[];for(var i=0;i<6;i++){(function(i){var rw=el("div");rw.style.cssText="display:flex;gap:8px;align-items:center";var sb=el("button","sbtn sm",stk(i));sk[i]=i;sb.setAttribute("aria-label","Figurinha do jogador "+(i+1));sb.onclick=function(){openPicker(function(j){sk[i]=j;sb.textContent=stk(j);});};var inp=document.createElement("input");inp.placeholder="Jogador "+(i+1);inp.maxLength=16;inp.setAttribute("aria-label","Nome do jogador "+(i+1));ins.push(inp);rw.appendChild(sb);rw.appendChild(inp);box.appendChild(rw);})(i);}
  var tw=el("div","chips");[["Sem tempo",0],["20 s",20],["30 s",30],["45 s",45],["60 s",60]].forEach(function(c){var b=el("button","chip"+(T===c[1]?" on":""),c[0]);b.onclick=function(){T=c[1];[].forEach.call(tw.children,function(x){x.classList.remove("on");});b.classList.add("on");};tw.appendChild(b);});
app.appendChild(box);app.appendChild(el("p","center","Tempo por pergunta"));app.appendChild(tw);
  var a=el("div","actions");
  a.appendChild(btn("Começar",function(){
    P=[];ins.forEach(function(x,i){var n=x.value.trim();if(n)P.push({n:n,s:0,k:0,c:0,tt:0,st:sk[i]});});
    if(!P.length)P.push({n:"Jogador 1",s:0,k:0,c:0,tt:0,st:sk[0]});
    qi=0;pi=0;turn();
  },"big"));
  app.appendChild(a);
}

function turn(){
  if(P.length===1){question();return;}
  clear();
  var h=el("h1",null,"Vez de "+stk(P[pi].st)+" "+P[pi].n);
  app.appendChild(h);
  app.appendChild(el("p","center","Pergunta "+(qi+1)+" de "+Q.length+" · "+Q[qi].t));
  var a=el("div","actions");a.appendChild(btn("Pronto",question,"big"));
  app.appendChild(a);
}

function question(){
  clear();locked=false;
  var q=Q[qi],pl=P[pi];
  var top=el("div","top");
  top.appendChild(el("span","pill","Pergunta "+(qi+1)+"/"+Q.length));
  top.appendChild(el("span","pill",stk(pl.st)+" "+pl.n+" · "+pl.s+" pts"));
  var tm=el("span","pill",T?T+"s":"Sem tempo");top.appendChild(tm);
  app.appendChild(top);
  var bar=el("div","bar"),fill=document.createElement("i");bar.appendChild(fill);if(T)app.appendChild(bar);
  app.appendChild(stemNode(q));
  var og=el("div","opts"+(q.s?" two":" two"));
  q.o.forEach(function(txt,i){
    var b=el("button","opt");b.dataset.i=i;
    b.innerHTML=SH[i];
    b.appendChild(optText(i,txt));
    b.onclick=function(){answer(i,og,tm);};
    og.appendChild(b);
  });
  app.appendChild(og);
  t0=Date.now();SND.start();lastLeft=99;
  if(T)tmr=setInterval(function(){
    var s=(Date.now()-t0)/1000,left=Math.max(0,Math.ceil(T-s));
    tm.textContent=left+"s";if(left<=5&&left>0&&left!==lastLeft){lastLeft=left;SND.tick();}
    fill.style.transform="scaleX("+Math.max(0,1-s/T)+")";
    if(s>=T)answer(-1,og,tm);
  },200);
  requestAnimationFrame(function(){fill.style.transform="scaleX(1)";});
}

function answer(i,og,tm){
  if(locked)return;locked=true;clearInterval(tmr);
  var q=Q[qi],pl=P[pi],el_=Math.min(T||99999,(Date.now()-t0)/1000),ok=i===q.a,gain=0;
  if(ok){pl.k++;pl.c++;gain=(T?Math.round(1000*(1-(el_/T)/2)):1000)+Math.min(pl.k-1,5)*100;pl.s+=gain;}else pl.k=0;
  pl.tt+=el_;if(ok)SND.correct();else SND.wrong();
  Array.prototype.forEach.call(og.children,function(b,j){b.disabled=true;if(j===q.a)b.classList.add("right");else b.classList.add("dim");});
  var f=el("div","fb "+(ok?"ok":"no"),i<0?"Tempo esgotado":ok?"Correto! +"+gain:"Incorreto");
  if(ok&&pl.k>1)f.appendChild(el("small",null,"Sequência de "+pl.k+" acertos"));
  app.appendChild(f);
  app.appendChild(el("div","exp","Resposta: "+String.fromCharCode(65+q.a)+". "+q.e));
  var a=el("div","actions");
  var last=pi===P.length-1;
  a.appendChild(btn(last?(qi===Q.length-1?"Ver resultado":"Ver placar"):"Próximo jogador",function(){
    if(!last){pi++;turn();}else if(qi===Q.length-1){final();}else{board();}
  },"big"));
  app.appendChild(a);
  f.scrollIntoView({block:"nearest",behavior:"smooth"});
}

function sorted(){return P.slice().sort(function(a,b){return b.s-a.s||a.tt-b.tt;});}

function board(){
  clear();
  app.appendChild(el("h1",null,"Placar"));
  app.appendChild(el("p","center","Depois da pergunta "+(qi+1)+" de "+Q.length));
  sorted().forEach(function(p,i){
    var r=el("div","row");r.appendChild(el("span","n",i+1));r.appendChild(el("span",null,stk(p.st)+" "+p.n+(p.k>1?"  ("+p.k+" seguidas)":"")));r.appendChild(el("b",null,p.s));app.appendChild(r);
  });
  var a=el("div","actions");
  a.appendChild(btn("Próxima pergunta",function(){qi++;pi=0;turn();},"big"));
  app.appendChild(a);
}

function final(){
  clear();
  var s=sorted();
  app.appendChild(el("h1",null,P.length>1?"Pódio":"Resultado final"));if(P.length===1&&P[0].c<6)SND.lose();else SND.win();

    r.appendChild(el("span",null,stk(p.st)+" "+p.n+" · "+p.c+"/"+Q.length+" acertos"));
    r.appendChild(el("b",null,p.s+" pts"));app.appendChild(r);
  });
  var a=el("div","actions");
  a.appendChild(btn("Jogar de novo",function(){P.forEach(function(p){p.s=0;p.k=0;p.c=0;p.tt=0;});qi=0;pi=0;turn();},"big"));
  a.appendChild(btn("Novos jogadores",setup));
  app.appendChild(a);
}

function CLR(){if(typeof clr==="function")clr();else clear();}
function rkId(n){return String(n).toLowerCase().replace(/[^a-z0-9_.~:@+-]/g,"_").slice(0,40)||"anon";}
function rkSort(a){return a.sort(function(x,y){return (y.pts-x.pts)||((y.best||0)-(x.best||0));}).slice(0,20);}
function rkShow(rows,back,msg){
  CLR();app.appendChild(el("h1",null,"Ranking geral"));
  app.appendChild(el("p","c","Os 20 melhores jogadores, somando os pontos de todas as partidas."));
  if(msg)app.appendChild(el("div","err",msg));
  if(rows&&rows.length){
    var pd=el("div","podium");
    [1,0,2].forEach(function(k){var p=rows[k];if(!p)return;var d=el("div","pod p"+(k+1));d.appendChild(el("div","m",["1º","2º","3º"][k]));d.appendChild(el("div","pst",stk(p.st)));d.appendChild(el("div",null,p.n));d.appendChild(el("span",null,p.pts+" pts"));pd.appendChild(d);});
    app.appendChild(pd);

  }else if(!msg)app.appendChild(el("p","c","Ainda não há partidas registradas. Jogue uma partida para entrar no ranking."));

}
function rkLoad(){try{return JSON.parse(localStorage.getItem("quizRank")||"{}");}catch(e){return {};}}
function rkSaveLocal(list){var m=rkLoad();list.forEach(function(p){if(!(p.pts>0))return;var k=rkId(p.n),o=m[k]||{n:p.n,pts:0,games:0,best:0};o.n=p.n;o.st=p.st;o.pts+=p.pts;o.games++;o.best=Math.max(o.best,p.pts);m[k]=o;});try{localStorage.setItem("quizRank",JSON.stringify(m));}catch(e){}}
